<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- "n." in Press Start 2P, drawn as pixel rects. SVG favicons cannot load
       external webfonts, so a font-family reference would silently fall back to
       a default face. This grid was extracted from the real font by rasterising
       it and reading the canvas back, confirmed identical at 64px and 128px. -->
  <style>
    rect { fill: #17181b; }
    @media (prefers-color-scheme: dark) { rect { fill: #f2f1ee; } }
  </style>
  <rect x="2" y="5" width="6" height="1"/><rect x="2" y="6" width="2" height="1"/><rect x="7" y="6" width="2" height="1"/><rect x="2" y="7" width="2" height="1"/><rect x="7" y="7" width="2" height="1"/><rect x="2" y="8" width="2" height="1"/><rect x="7" y="8" width="2" height="1"/><rect x="12" y="8" width="2" height="1"/><rect x="2" y="9" width="2" height="1"/><rect x="7" y="9" width="2" height="1"/><rect x="12" y="9" width="2" height="1"/>
</svg>
